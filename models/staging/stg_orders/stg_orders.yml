version: 2

models:
  - name: stg_orders
    description: "This model transforms the raw orders data into a structured format."
    columns:
      - name: order_id
        description: "Unique identifier for the order"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Unique identifier for the customer placing the order"
        tests:
          - not_null
      - name: order_date
        description: "Date when the order was placed"
        tests:
          - not_null
      - name: total_amount
        description: "Total amount for the order"
        tests:
          - not_null
          - positive_total_amount
      - name: order_status
        description: The status of the order (e.g., 'completed', 'pending', 'canceled').
        tests:
          - accepted_values:
              arguments:
                values:
                  - 'delivered'
                  - 'pending'
                  - 'canceled'
                  - 'shipped'