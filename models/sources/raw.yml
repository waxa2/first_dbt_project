version: 2

sources:
  - name: staging
    description: This source contains the raw data from the external system.
    tables:
      - name: customers
        description: This table contains the costumers data.
        columns:
          - name: customer_id
            description: The unique identifier for each customer.
            tests:
              - not_null
              - unique
          - name: first_name
            description: The first name of the customer.
            tests:
              - not_null
          - name: loaded_at
            description: The timestamp when the record was loaded into the database.
            tests:
              - not_null


        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 1, period: day}
          error_after: {count: 2, period: day}

      - name: orders
        description: This table contains the orders data.
        columns:
          - name: total_amount
            description: The total amount spent by the customer.
            tests:
            - not_null
            - positive_total_amount
          - name: loaded_at
            description: The timestamp when the record was loaded into the database.
            tests:
              - not_null
